<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f9f7f5" />
    <!-- The mark sodax.com serves, byte-for-byte — copied from sodax-frontend apps/web/app. -->
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Inria+Serif:wght@400&family=Inter:wght@400;500;700&family=Manrope:wght@400;500;600&family=Shrikhand&family=Space+Grotesk:wght@400;500;700&display=swap"
    />
    <meta
      name="description"
      content="An embeddable SODAX swap widget: live cross-network quotes across every network SODAX reaches, EVM and non-EVM, with no wallet connection."
    />
    <title>SODAX Swap Widget</title>
    <script>
      // Resolves the theme before first paint so an embed never flashes the wrong one; mirrors
      // resolveTheme() in src/hooks/useBrand.ts, minus its colour maths. `theme` is the embed's.
      try {
        var params = new URLSearchParams(location.search);
        var pinned = params.get('embed') === '1' ? params.get('theme') : null;
        var stored = localStorage.getItem('sodax-playground-theme');
        var system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var resolved =
          pinned === 'dark' || pinned === 'light'
            ? pinned
            : pinned === 'auto'
              ? system
              : stored === 'dark' || stored === 'light'
                ? stored
                : system;
        document.documentElement.dataset.theme = resolved;
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
