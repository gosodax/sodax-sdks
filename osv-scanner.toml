[[IgnoredVulns]]
id = "CVE-2025-3194"
ignoreUntil = 2026-12-03
reason = "bigint-buffer@1.1.5 reached two ways: @solana/web3.js@1.98.0 declares it directly (^1.1.5) and calls toBigIntLE in lib/index.cjs.js, and @solana/spl-token pulls it through @solana/buffer-layout-utils. No fix exists: 1.1.5 is the latest release (published 2019) and the advisory has no patched range. Not removable by a bump: @solana/web3.js is catalog-pinned and requires it outright, and @solana/buffer-layout-utils@0.3.0, the newest, still requires ^1.1.5, so moving @solana/spl-token 0.4.9 -> 0.4.15 keeps it too. Not reachable as described: the overflow is in the native binding, and bigint-buffer's install script never runs here (pnpm 10 skips dependency lifecycle scripts absent onlyBuiltDependencies, which this workspace does not set), so no build/ directory exists, require(bindings) throws and dist/node.js falls back to its pure-JS toBigIntLE."

