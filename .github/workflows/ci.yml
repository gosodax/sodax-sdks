name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed paths
    timeout-minutes: 5
    runs-on: ubuntu-latest
    # The files API below needs `pull-requests: read`, which `contents: read` does not cover.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}

    steps:
      # Deliberately a job output consumed by an `if:`, not a workflow-level `paths-ignore`:
      # a workflow skipped by a path filter never reports, so a required check stays pending
      # forever, while a job skipped by `if:` reports as passing.
      - name: Classify the pull request diff
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          # Every branch below defaults to running the full build: skipping it is the answer
          # that can hide a regression, so only an explicitly docs-only diff earns it. A rename
          # reports only its destination as `filename`, so `previous_filename` is listed too:
          # source moved into docs/ still deletes source. grep is read to the end rather than
          # -q, which can SIGPIPE under pipefail on a long list.
          if [ -z "$files" ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          outside_docs=$(printf '%s\n' "$files" | grep -vE '^docs/' || true)
          if [ -n "$outside_docs" ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
            echo 'Only docs/ changed: skipping build and tests. The Docs site job still runs.'
          fi

  private-hosts:
    name: No private hosts
    timeout-minutes: 5
    runs-on: ubuntu-latest
    # Deliberately not a step inside `docs` or `build`: both are gated on the `changes` job, so a
    # guard living in either could be skipped by exactly the diff it exists to catch.
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: No private vendor hosts
        run: |
          set -euo pipefail
          # This repo is public: every host an SDK consumer can reach must be the unified API
          # (api.sodax.com / canary-api.sodax.com). The domain is assembled from parts so this
          # file does not match its own pattern and can stay inside the scanned tree.
          domain='iconblockchain'
          if git grep -In "${domain}\.xyz" -- . ':!pnpm-lock.yaml'; then
            echo "::error::private ${domain}.xyz host reintroduced — use api.sodax.com or canary-api.sodax.com"
            exit 1
          fi

  docs:
    name: Docs site
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Runs on every pull request, including code-only ones: the doc-link and generated-page
    # checks read package READMEs and packages/sdk/docs, which a code change can break.
    # Read-only: this is the one job that executes a dependency tree the repo does not pin.
    permissions:
      contents: read
    env:
      # Pinned, and at least 14 days old, per the supply-chain rules. The CLI is not a repo
      # dependency: it pulls puppeteer, which no other repo task needs.
      MINT_VERSION: '4.2.794'
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'

      # These four scripts import only node: builtins, so they need no pnpm install.
      - name: Doc link validation
        run: pnpm check:doc-links

      - name: Docs navigation validation
        run: pnpm check:docs-nav

      - name: Generated docs page drift
        run: pnpm check:docs-pages

      - name: AI dev file validation
        run: pnpm check:ai-dev-files

      # The ~65 hand-written pages have no other check: check:doc-links reads mapped sources
      # and check:docs-nav reads navigation, so neither opens them. `broken-links` is also the
      # only check that catches a relative link, which resolves in preview and 404s in prod.
      - name: Mintlify build validation and broken links
        working-directory: docs
        run: |
          pnpm dlx "mint@${MINT_VERSION}" validate
          pnpm dlx "mint@${MINT_VERSION}" broken-links

  build:
    name: Build and Test
    needs: changes
    # Fail closed: only an explicit docs-only verdict skips this job, so a classifier that errors
    # still builds. `!cancelled()` is what lets it run at all when `changes` failed.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Linux-only. Turbopack has historically had platform-specific
        # behaviour around pnpm workspace symlinks and file paths; if you
        # need Windows / macOS coverage for the regression check, extend
        # `runs-on` rather than this matrix.
        node-version: ['24.x']

    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Turborepo version
        id: turbo
        run: echo "version=$(node -p 'require("turbo/package.json").version')" >> "$GITHUB_OUTPUT"

      # Local Turborepo cache, persisted between runs (no remote cache). Task hashes already
      # cover sources, turbo.json, globalDependencies, the lockfile and declared env, so a
      # restored entry can never be replayed for changed inputs. The key carries what turbo
      # does not hash: runner OS, Node major, and the turbo release whose on-disk cache format
      # wrote the entries. Bump `v1` to force a cold cache.
      - name: Restore Turborepo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-v1-${{ runner.os }}-node${{ matrix.node-version }}-turbo${{ steps.turbo.outputs.version }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-v1-${{ runner.os }}-node${{ matrix.node-version }}-turbo${{ steps.turbo.outputs.version }}-

      - name: Lint
        run: pnpm lint

      - name: Check Circular Dependencies
        run: pnpm check:circular-deps

      - name: Knip (unused files / exports / deps)
        run: pnpm check:knip

      - name: Build Packages
        run: pnpm build:packages

      - name: Check Package Types & Exports (attw)
        run: pnpm check-exports

      - name: SDK tarball size check
        # Refresh the baseline from a known-good build (`pnpm --filter @sodax/sdk size:check`)
        # whenever a deliberate size increase lands; the tolerance is noise, not a growth budget.
        env:
          SODAX_SDK_TARBALL_BASELINE_BYTES: '1000000' # measured 999087 B on the merge of main into this branch
          SODAX_SDK_TARBALL_TOLERANCE_PCT: '5'
        run: pnpm --filter @sodax/sdk size:check

      - name: Build Check
        run: pnpm checkTs

      # The docs and AI-dev-file checks run in the `docs` job, which is not skipped on a
      # docs-only pull request.
      - name: AI docs validation
        run: pnpm check:ai

      - name: Build Apps
        timeout-minutes: 10
        run: pnpm turbo run build --filter='./apps/demo' --filter='./apps/example-next-js-16' --filter='./apps/wallet-modal-example'

      - name: SDK features powered by @sodax/libs (Node smoke)
        run: pnpm --filter node test-libs

      - name: Next.js 16 Turbopack regression check
        # Skip `next build` — the previous `Build Apps` step already built it, and a turbo
        # cache hit restores `.next/**` (only `.next/cache/**` is excluded), so `next start`
        # has everything it needs to serve the production build.
        run: pnpm --filter example-next-js-16 verify-only

      - name: Run Tests
        run: pnpm test

      # restore-keys makes each run inherit the previous run's entries and add its own, so the
      # artifact grows without a cap until restore + save costs more than the rebuild it saves.
      # Keep the newest 150 entries (~500 MB at current task sizes); one full run needs ~55.
      - name: Prune Turborepo cache
        if: always()
        run: |
          cd .turbo/cache || exit 0
          ls -t -- *.tar.zst 2>/dev/null | tail -n +151 | sed 's/\.tar\.zst$//' \
            | xargs -r -I{} rm -f -- '{}.tar.zst' '{}-meta.json' '{}-manifest.json'
          echo "turbo cache: $(ls -1 -- *.tar.zst 2>/dev/null | wc -l) entries, $(du -sh . | cut -f1)"

      # Saved even on failure so a red run still banks the packages it did build. Deliberately
      # not added to the e2e job: `test:e2e` is a cacheable task, and a restored green entry
      # would skip the live mainnet run.
      - name: Save Turborepo cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-v1-${{ runner.os }}-node${{ matrix.node-version }}-turbo${{ steps.turbo.outputs.version }}-${{ github.sha }}-${{ github.run_attempt }}

  e2e:
    name: E2E Tests (live mainnet, advisory)
    # PRs only. The live suite is guidance (step continue-on-error + warning annotation) so this
    # check stays green; job-level continue-on-error would still post a red check. Setup/build fail normally.
    # Job timeout is only for install/build hangs; the live suite's budget is on the step so a
    # timeout stays advisory instead of cancelling the job.
    if: github.event_name == 'pull_request'
    timeout-minutes: 25
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.x']

    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build:packages

      # continue-on-error on the step (not the job): the check stays green; the step is yellow.
      # timeout-minutes here (not on the job) so a hung live suite is failure/cancelled, not a red job.
      - name: Run E2E Tests
        id: e2e
        timeout-minutes: 15
        continue-on-error: true
        run: pnpm test:e2e

      - name: Annotate E2E failure as warning
        if: steps.e2e.outcome == 'failure' || steps.e2e.outcome == 'cancelled'
        run: |
          echo "::warning title=E2E Tests (live mainnet)::Live mainnet e2e failed or timed out. Guidance only — this check stays green. See the step log or run pnpm test:e2e locally."
