name: Publish SODAX SDK Packages to npmjs

# `@sdks@X.Y.Z` publishes every package at one version; `@sodax/<pkg>@X.Y.Z` publishes one package (backports).
on:
  push:
    tags:
      - '@sdks@*.*.*'
      - '@sodax/*@*.*.*'

concurrency:
  group: sdks-publish
  cancel-in-progress: false

permissions: {}

jobs:
  # Everything that runs repository or dependency code happens here, with no secrets and no environment.
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release: ${{ steps.pack.outputs.release }}
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve packages and validate manifests
        id: resolve
        run: |
          # Topological order: each package publishes after the packages it depends on.
          PACKAGES=(types libs swaps-api bridge-api wallet-sdk-core sdk wallet-sdk-react dapp-kit skills)
          case "$GITHUB_REF_NAME" in
            @sdks@*)
              VERSION="${GITHUB_REF_NAME#@sdks@}"
              SELECTED=("${PACKAGES[@]}")
              ;;
            @sodax/*@*)
              rest="${GITHUB_REF_NAME#@sodax/}"
              PKG="${rest%%@*}"
              VERSION="${rest#*@}"
              if [[ " ${PACKAGES[*]} " != *" $PKG "* ]]; then
                echo "::error::@sodax/$PKG is not a publishable package (${PACKAGES[*]})"
                exit 1
              fi
              SELECTED=("$PKG")
              ;;
            *)
              echo "::error::Unrecognised release tag $GITHUB_REF_NAME"
              exit 1
              ;;
          esac
          for pkg in "${SELECTED[@]}"; do
            actual=$(jq -er .version "packages/$pkg/package.json")
            if [[ "$actual" != "$VERSION" ]]; then
              echo "::error::packages/$pkg/package.json version ($actual) does not match git tag ($VERSION)"
              exit 1
            fi
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "packages=${SELECTED[*]}" >> "$GITHUB_OUTPUT"

      - name: Require unified releases to come from the release branch
        if: startsWith(github.ref_name, '@sdks@')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/release; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on the release branch"
            exit 1
          fi

      # CI never runs on the release branch, where every bump happens, so this is the only automation
      # that sees the constant before it ships. Node builtins only — before the install, so it fails fast.
      - name: Validate CONFIG_VERSION matches the released version
        run: node scripts/config-version.mjs --check

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, typecheck, test and check exports
        run: |
          FILTERS=()
          for pkg in $PACKAGES; do FILTERS+=("--filter=@sodax/$pkg"); done
          pnpm turbo run build checkTs test check-exports check:ai "${FILTERS[@]}"
        env:
          PACKAGES: ${{ steps.resolve.outputs.packages }}

      # pnpm pack rewrites workspace: and catalog: specifiers; the publish job ships these exact files.
      - name: Pack tarballs and choose dist-tags
        id: pack
        run: |
          DEST="$RUNNER_TEMP/tarballs"
          mkdir -p "$DEST"
          : > "$RUNNER_TEMP/release.txt"
          for pkg in $PACKAGES; do
            (cd "packages/$pkg" && pnpm pack --pack-destination "$DEST")
            tarball="sodax-$pkg-$VERSION.tgz"
            test -f "$DEST/$tarball" || { echo "::error::pnpm pack did not produce $tarball"; exit 1; }
            if latest=$(npm view "@sodax/$pkg" dist-tags.latest 2> "$RUNNER_TEMP/npm-view.err"); then
              :
            elif grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
              latest=""
            else
              cat "$RUNNER_TEMP/npm-view.err"
              exit 1
            fi
            dist_tag=$(node scripts/publish-dist-tag.mjs "$VERSION" "$latest")
            sha=$(sha256sum "$DEST/$tarball" | cut -d' ' -f1)
            echo "$pkg $tarball $sha $dist_tag" >> "$RUNNER_TEMP/release.txt"
            echo "@sodax/$pkg@$VERSION → $dist_tag (current latest: ${latest:-none})"
          done
          { echo 'release<<RELEASE_EOF'; cat "$RUNNER_TEMP/release.txt"; echo 'RELEASE_EOF'; } >> "$GITHUB_OUTPUT"
        env:
          PACKAGES: ${{ steps.resolve.outputs.packages }}
          VERSION: ${{ steps.resolve.outputs.version }}

      - name: Upload tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Runs no repository or dependency code: no checkout, no install, prebuilt tarballs only.
  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Download tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarballs
          path: tarballs

      - name: Verify tarballs match what was checked
        working-directory: tarballs
        run: |
          while read -r pkg tarball sha dist_tag; do
            [[ -n "$pkg" ]] || continue
            echo "$sha  $tarball" | sha256sum -c -
          done <<< "$RELEASE"
        env:
          RELEASE: ${{ needs.verify.outputs.release }}

      # npm >= 11.5.1 uses trusted publishing (OIDC) when it is configured for the package and falls
      # back to NODE_AUTH_TOKEN otherwise. Already-published versions are skipped so a re-run resumes.
      - name: Publish packages in topological order
        working-directory: tarballs
        run: |
          while read -r pkg tarball sha dist_tag; do
            [[ -n "$pkg" ]] || continue
            if [[ -n "$(npm view "@sodax/$pkg@$VERSION" version 2> /dev/null)" ]]; then
              echo "::notice::@sodax/$pkg@$VERSION is already on npm; skipping"
              continue
            fi
            echo "::group::Publishing @sodax/$pkg@$VERSION under $dist_tag"
            npm publish "./$tarball" --provenance --access public --tag "$dist_tag"
            echo "::endgroup::"
          done <<< "$RELEASE"
        env:
          RELEASE: ${{ needs.verify.outputs.release }}
          VERSION: ${{ needs.verify.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.SODAX_SDKS_NPM_PUBLISH_TOKEN }}
