name: Publish All SODAX SDK Packages to npmjs

on:
  push:
    tags:
      - '@sdks@*.*.*'

concurrency:
  group: sdks-publish
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Validate tag matches all package.json versions and determine dist-tag
        id: dist_tag
        run: |
          EXPECTED_VERSION="${GITHUB_REF_NAME#@sdks@}"
          PACKAGES=(types libs swaps-api bridge-api wallet-sdk-core sdk wallet-sdk-react dapp-kit skills)
          for pkg in "${PACKAGES[@]}"; do
            actual=$(jq -er .version "packages/$pkg/package.json")
            if [[ "$actual" != "$EXPECTED_VERSION" ]]; then
              echo "::error::packages/$pkg/package.json version ($actual) does not match git tag ($EXPECTED_VERSION)"
              exit 1
            fi
          done
          if [[ "$EXPECTED_VERSION" == *-* ]]; then
            PRERELEASE_ID="${EXPECTED_VERSION#*-}"
            TAG="${PRERELEASE_ID%%.*}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # CI never runs on the release branch, where every bump happens, so this is the only automation
      # that sees the constant before it ships. The step above already pins the manifest to the tag,
      # so checking the constant against the manifest pins it to the tag too. Node builtins only —
      # deliberately before the install, so a bad constant fails fast.
      - name: Validate CONFIG_VERSION matches the released version
        run: node scripts/config-version.mjs --check

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Publish packages in topological order
        run: |
          PACKAGES=(types libs swaps-api bridge-api wallet-sdk-core sdk wallet-sdk-react dapp-kit skills)
          for pkg in "${PACKAGES[@]}"; do
            echo "::group::Publishing @sodax/$pkg"
            (cd "packages/$pkg" && pnpm publish --no-git-checks --provenance --access public --tag "$DIST_TAG")
            echo "::endgroup::"
          done
        env:
          DIST_TAG: ${{ steps.dist_tag.outputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.SODAX_SDKS_NPM_PUBLISH_TOKEN }}
